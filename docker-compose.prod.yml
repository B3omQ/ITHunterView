version: '3.8'

services:
  # ─── PostgreSQL + pgvector ───────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: ithunterview_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ithunterview}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ithunterview}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── .NET Backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ithunterview_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME:-ithunterview};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${BACKEND_URL}
      - JwtSettings__Audience=${BACKEND_URL}
      - JwtSettings__ExpiryMinutes=60
      - FrontendUrl=${FRONTEND_URL}
      - GoogleAuth__ClientId=${GOOGLE_CLIENT_ID}
      - SmtpSettings__Host=${SMTP_HOST}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL}
      - SmtpSettings__FromName=ITHunterView
      - CloudinarySettings__CloudName=${CLOUDINARY_CLOUD_NAME}
      - CloudinarySettings__ApiKey=${CLOUDINARY_API_KEY}
      - CloudinarySettings__ApiSecret=${CLOUDINARY_API_SECRET}
      - GeminiSettings__ApiKey=${GEMINI_API_KEY}
      - AiBypassConfig__ApiKey=${GEMINI_API_KEY}
      - AiBypassConfig__ModelName=gemini-2.5-flash
      - AiSettings__DefaultProvider=Gemini
      - AiSettings__Providers__Gemini__ApiKey=${GEMINI_API_KEY}
      - AiSettings__Providers__Gemini__Model=gemini-2.5-flash
      - AiSettings__Providers__Gemini__Endpoint=https://generativelanguage.googleapis.com/v1beta/models
      - AssemblyAi__ApiKey=${ASSEMBLY_AI_API_KEY}
    networks:
      - internal
      - web

  # ─── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${BACKEND_URL}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: ithunterview_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ithunterview_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - web

  # ─── Certbot (Let's Encrypt SSL) ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: ithunterview_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

networks:
  internal:
    driver: bridge
  web:
    driver: bridge

volumes:
  pgdata:
  certbot_www:
  certbot_certs:
