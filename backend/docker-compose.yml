version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ithunterview_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ithunterview
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: ithunterview_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
